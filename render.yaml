services:
  - type: web
    name: breastvisionai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SUPERUSER_USERNAME
        value: breastvisionai
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@breastvisionai.com
      - key: DJANGO_SUPERUSER_PASSWORD
        value: Password123@
